name: Hourly RAG Update

on:
  schedule:
    - cron: "15 * * * *"   # Runs every hour at :15
  workflow_dispatch:

jobs:
  update-rag:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1. Checkout Repository
      # -------------------------------------------------
      - name: Checkout Repo
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2. Setup Python
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -------------------------------------------------
      # 3. Install Dependencies (COMPLETE)
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip

          # Core
          pip install numpy tqdm requests

          # Scraping & parsing
          pip install feedparser beautifulsoup4 readability-lxml lxml

          # Embeddings
          pip install sentence-transformers torch

          # RAG / Indexing
          pip install faiss-cpu

          # Hugging Face
          pip install huggingface_hub

      # -------------------------------------------------
      # 4. Run Pipeline (Scrape → Filter → Chunk → Embed)
      # -------------------------------------------------
      - name: Run Pipeline (Scrape → Filter → Chunk → Embed)
        env:
          COMPUTE_EMBEDDINGS: "1"
        run: |
          python pipeline/scrape.py
          python pipeline/filter.py
          python pipeline/dataset_builder.py

      # -------------------------------------------------
      # 5. Build FAISS + Upload to Hugging Face
      # -------------------------------------------------
      - name: Upload RAG to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python pipeline/push_to_hf.py
