name: Hourly RAG Update

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  update-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify critical packages
        run: |
          python -c "import requests, feedparser, numpy; print('Dependencies OK')"

      - name: Run Pipeline (Scrape → Filter → Dataset Build)
        env:
          COMPUTE_EMBEDDINGS: "1"
        run: |
          python pipeline/scrape.py
          python pipeline/filter.py
          python pipeline/dataset_builder.py

      - name: Upload RAG to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python pipeline/push_to_hf.py
